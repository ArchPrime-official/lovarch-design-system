name: Storybook

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # A catalogue that does not build is worse than no catalogue: consumers
      # trust it to answer "does this component exist?", so a broken build must
      # never reach main.
      - name: Build Storybook
        run: npm run build-storybook

      - name: Typecheck
        run: npm run typecheck
