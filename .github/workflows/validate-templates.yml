name: Validate Templates

on:
  pull_request:
    branches: [main]
    paths:
      - "src/templates/**"
      - "src/blocks/**"
      - "src/lib/icon-allowlist.ts"
      - "scripts/validate-templates.ts"
      - "package.json"
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate templates against AnyBlockSchema
        run: npm run validate:templates
